name: Build OS Browser

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target_os:
        description: "Target OS"
        required: false
        default: "linux"
        type: choice
        options:
          - linux
          - win
          - android
      target_cpu:
        description: "Target CPU architecture"
        required: false
        default: "x64"
        type: choice
        options:
          - x64
          - x86
          - arm64
          - arm

env:
  PRODUCT_NAME: os_browser
  DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
  CHROMIUM_OUT_DIR: out/Default

permissions:
  contents: read

concurrency:
  group: build-os-browser-${{ github.ref }}-${{ github.event_name }}-${{ inputs.target_os || 'auto' }}-${{ inputs.target_cpu || 'auto' }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build OS Browser Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_os == 'linux' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Chromium source checkout
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f ".gn" ]; then
            echo "::error::This workflow must run from the root of a Chromium source checkout or fork."
            echo "::error::Missing .gn file. If this repo only contains patches or browser branding files, add a step that fetches Chromium first."
            exit 1
          fi

          if [ ! -d "build" ]; then
            echo "::error::Missing Chromium build/ directory."
            exit 1
          fi

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            git \
            curl \
            wget \
            lsb-release \
            pkg-config \
            build-essential \
            ninja-build \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf2.0-dev \
            libxss-dev \
            libxtst-dev \
            libnss3-dev \
            libcups2-dev \
            libxrandr-dev \
            libasound2-dev \
            libpulse-dev \
            libspeechd-dev \
            libdbus-1-dev

      - name: Set up depot_tools
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /tmp/depot_tools
          echo "/tmp/depot_tools" >> "$GITHUB_PATH"

      - name: Install Chromium build dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -x "build/install-build-deps.sh" ]; then
            sudo build/install-build-deps.sh --no-prompt || true
          else
            echo "build/install-build-deps.sh not found or not executable; skipping."
          fi

      - name: Configure GN build args
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$CHROMIUM_OUT_DIR"

          cat > "$CHROMIUM_OUT_DIR/args.gn" <<'GN_EOF'
          is_debug = false
          is_official_build = false
          is_component_build = false
          symbol_level = 0

          target_os = "linux"
          target_cpu = "x64"

          branding_path_component = "chromium"
          chrome_pgo_phase = 0

          enable_nacl = false
          enable_linux_installer = false
          treat_warnings_as_errors = false

          use_sysroot = true
          use_lld = true
          GN_EOF

          cat "$CHROMIUM_OUT_DIR/args.gn"

      - name: Generate build files
        shell: bash
        run: |
          set -euo pipefail
          gn gen "$CHROMIUM_OUT_DIR"

      - name: Compile OS Browser
        shell: bash
        run: |
          set -euo pipefail
          autoninja -C "$CHROMIUM_OUT_DIR" chrome -j"$(nproc)"

      - name: Package Linux artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts

          cp "$CHROMIUM_OUT_DIR/chrome" artifacts/

          cp "$CHROMIUM_OUT_DIR/chrome_sandbox" artifacts/ 2>/dev/null || true
          cp "$CHROMIUM_OUT_DIR/icudtl.dat" artifacts/ 2>/dev/null || true

          cp "$CHROMIUM_OUT_DIR/"*.pak artifacts/ 2>/dev/null || true
          cp "$CHROMIUM_OUT_DIR/"*.bin artifacts/ 2>/dev/null || true
          cp "$CHROMIUM_OUT_DIR/"*.so artifacts/ 2>/dev/null || true

          cp -r "$CHROMIUM_OUT_DIR/locales" artifacts/ 2>/dev/null || true
          cp -r "$CHROMIUM_OUT_DIR/resources" artifacts/ 2>/dev/null || true
          cp -r "$CHROMIUM_OUT_DIR/swiftshader" artifacts/ 2>/dev/null || true

          cat > artifacts/run-os-browser.sh <<'EOF'
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/chrome" "$@"
          EOF
          chmod +x artifacts/run-os-browser.sh

          tar -czf os-browser-linux-x64.tar.gz -C artifacts .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-browser-linux-x64
          path: os-browser-linux-x64.tar.gz
          retention-days: 14

  build-windows:
    name: Build OS Browser Windows ${{ inputs.target_cpu || 'x64' }}
    runs-on: windows-2022
    timeout-minutes: 360
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_os == 'win' }}

    env:
      CHROMIUM_OUT_DIR: out/Default

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Chromium source checkout
        shell: powershell
        run: |
          if (!(Test-Path ".gn")) {
            Write-Error "This workflow must run from the root of a Chromium source checkout or fork. Missing .gn file."
          }

          if (!(Test-Path "build")) {
            Write-Error "Missing Chromium build/ directory."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up depot_tools
        shell: powershell
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve build CPU
        id: cpu
        shell: powershell
        run: |
          $cpu = "${{ inputs.target_cpu }}"
          if ([string]::IsNullOrWhiteSpace($cpu)) {
            $cpu = "x64"
          }

          if ($cpu -ne "x64" -and $cpu -ne "x86" -and $cpu -ne "arm64") {
            Write-Error "Windows target_cpu must be x64, x86, or arm64. Got: $cpu"
          }

          "cpu=$cpu" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Configure GN build args
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "${env:CHROMIUM_OUT_DIR}" | Out-Null

          @"
          is_debug = false
          is_official_build = false
          is_component_build = false
          symbol_level = 0

          target_os = "win"
          target_cpu = "${{ steps.cpu.outputs.cpu }}"

          branding_path_component = "chromium"
          chrome_pgo_phase = 0

          enable_nacl = false
          treat_warnings_as_errors = false

          use_lld = true
          "@ | Set-Content -Path "${env:CHROMIUM_OUT_DIR}\args.gn" -Encoding ascii

          Get-Content "${env:CHROMIUM_OUT_DIR}\args.gn"

      - name: Generate build files
        shell: cmd
        run: gn gen %CHROMIUM_OUT_DIR%

      - name: Compile OS Browser
        shell: cmd
        run: autoninja -C %CHROMIUM_OUT_DIR% chrome

      - name: Package Windows artifact
        shell: powershell
        run: |
          Remove-Item -Recurse -Force artifacts -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          Copy-Item "${env:CHROMIUM_OUT_DIR}\chrome.exe" artifacts\
          Copy-Item "${env:CHROMIUM_OUT_DIR}\*.dll" artifacts\ -ErrorAction SilentlyContinue
          Copy-Item "${env:CHROMIUM_OUT_DIR}\*.pak" artifacts\ -ErrorAction SilentlyContinue
          Copy-Item "${env:CHROMIUM_OUT_DIR}\*.bin" artifacts\ -ErrorAction SilentlyContinue
          Copy-Item "${env:CHROMIUM_OUT_DIR}\icudtl.dat" artifacts\ -ErrorAction SilentlyContinue
          Copy-Item "${env:CHROMIUM_OUT_DIR}\locales" artifacts\ -Recurse -ErrorAction SilentlyContinue
          Copy-Item "${env:CHROMIUM_OUT_DIR}\resources" artifacts\ -Recurse -ErrorAction SilentlyContinue
          Copy-Item "${env:CHROMIUM_OUT_DIR}\swiftshader" artifacts\ -Recurse -ErrorAction SilentlyContinue

          Compress-Archive -Path artifacts\* -DestinationPath "os-browser-windows-${{ steps.cpu.outputs.cpu }}.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-browser-windows-${{ steps.cpu.outputs.cpu }}
          path: os-browser-windows-${{ steps.cpu.outputs.cpu }}.zip
          retention-days: 14

  build-android:
    name: Build OS Browser Android ${{ inputs.target_cpu || 'arm64' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_os == 'android' }}

    env:
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_HOME: /opt/android-sdk
      NDK_VERSION: "27.2.12479018"
      BUILD_TOOLS_VERSION: "34.0.0"
      ANDROID_API_LEVEL: "33"
      CHROMIUM_OUT_DIR: out/Android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Chromium source checkout
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f ".gn" ]; then
            echo "::error::This workflow must run from the root of a Chromium source checkout or fork."
            echo "::error::Missing .gn file."
            exit 1
          fi

          if [ ! -d "build" ]; then
            echo "::error::Missing Chromium build/ directory."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            git \
            curl \
            wget \
            unzip \
            lsb-release \
            pkg-config \
            build-essential \
            ninja-build \
            libncurses5 \
            lib32z1 \
            lib32stdc++6 \
            libc6-i386 \
            openjdk-17-jdk

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail

          sudo mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          sudo unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"

          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            sudo rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi

          sudo mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          sudo chown -R "$USER:$USER" "$ANDROID_SDK_ROOT"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses and install NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses

          sdkmanager \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "platform-tools" \
            "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up depot_tools
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /tmp/depot_tools
          echo "/tmp/depot_tools" >> "$GITHUB_PATH"

      - name: Install Chromium Android build dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -x "build/install-build-deps.sh" ]; then
            sudo build/install-build-deps.sh --no-prompt --android || true
          fi

          if [ -x "build/install-build-deps-android.sh" ]; then
            sudo build/install-build-deps-android.sh || true
          fi

      - name: Resolve Android CPU
        id: cpu
        shell: bash
        run: |
          set -euo pipefail

          CPU="${{ inputs.target_cpu }}"

          if [ -z "$CPU" ]; then
            CPU="arm64"
          fi

          case "$CPU" in
            arm64)
              GN_CPU="arm64"
              ;;
            arm)
              GN_CPU="arm"
              ;;
            x64)
              GN_CPU="x64"
              ;;
            x86)
              GN_CPU="x86"
              ;;
            *)
              echo "::error::Invalid Android target_cpu: $CPU"
              exit 1
              ;;
          esac

          echo "cpu=$GN_CPU" >> "$GITHUB_OUTPUT"

      - name: Configure GN build args
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$CHROMIUM_OUT_DIR"

          cat > "$CHROMIUM_OUT_DIR/args.gn" <<GN_EOF
          is_debug = false
          is_official_build = false
          is_component_build = false
          symbol_level = 0

          target_os = "android"
          target_cpu = "${{ steps.cpu.outputs.cpu }}"

          branding_path_component = "chromium"
          chrome_pgo_phase = 0

          enable_nacl = false
          treat_warnings_as_errors = false

          android_sdk_version = "${ANDROID_API_LEVEL}"
          android_sdk_root = "${ANDROID_SDK_ROOT}"
          android_ndk_root = "${ANDROID_NDK_HOME}"

          use_lld = true
          GN_EOF

          cat "$CHROMIUM_OUT_DIR/args.gn"

      - name: Generate build files
        shell: bash
        run: |
          set -euo pipefail
          gn gen "$CHROMIUM_OUT_DIR"

      - name: Compile OS Browser APK
        shell: bash
        run: |
          set -euo pipefail
          autoninja -C "$CHROMIUM_OUT_DIR" chrome_public_apk -j"$(nproc)"

      - name: Locate and rename APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$CHROMIUM_OUT_DIR" -type f \( -name "ChromePublic.apk" -o -name "chrome_public.apk" -o -name "*.apk" \) | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            find "$CHROMIUM_OUT_DIR" -maxdepth 4 -type f | sort | tail -200
            exit 1
          fi

          echo "Found APK: $APK"
          cp "$APK" "os-browser-android-${{ steps.cpu.outputs.cpu }}.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-browser-android-${{ steps.cpu.outputs.cpu }}
          path: os-browser-android-${{ steps.cpu.outputs.cpu }}.apk
          retention-days: 14
