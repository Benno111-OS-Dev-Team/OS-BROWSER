name: Build OS Browser

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_os:
        description: 'Target OS (win, linux, android)'
        required: false
        default: 'linux'
        type: choice
        options:
          - linux
          - win
          - android
      target_cpu:
        description: 'Target CPU architecture (x64/x86 for desktop; arm64/arm for Android)'
        required: false
        default: 'x64'
        type: choice
        options:
          - x64
          - x86
          - arm64
          - arm

env:
  PRODUCT_NAME: os_browser
  DEPOT_TOOLS_WIN_TOOLCHAIN: 0

permissions:
  contents: read

jobs:
  build-linux:
    name: Build OS Browser (Linux x64)
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_os == 'linux' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip \
            git curl wget \
            lsb-release \
            pkg-config \
            build-essential \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf2.0-dev \
            libxss-dev \
            libxtst-dev \
            libnss3-dev \
            libcups2-dev \
            libxrandr-dev \
            libasound2-dev \
            libpulse-dev \
            libspeechd-dev \
            libdbus-1-dev

      - name: Set up depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /tmp/depot_tools
          echo "/tmp/depot_tools" >> $GITHUB_PATH
          /tmp/depot_tools/update_depot_tools
          python3 /tmp/depot_tools/bootstrap/ensure_bootstrap.py
          python3 /tmp/depot_tools/gclient.py --version

      - name: Install build dependencies via install-build-deps.sh
        run: |
          chmod +x build/install-build-deps.sh
          sudo build/install-build-deps.sh --no-prompt

      - name: Configure GN build args (Linux)
        run: |
          mkdir -p out/Default
          cat > out/Default/args.gn << 'GN_EOF'
          is_debug = false
          is_official_build = false
          is_component_build = false
          symbol_level = 0
          target_os = "linux"
          target_cpu = "x64"
          branding_path_component = "chromium"
          chrome_pgo_phase = 0
          enable_nacl = false
          enable_linux_installer = false
          GN_EOF

      - name: Generate build files
        run: |
          gn gen out/Default

      - name: Compile OS Browser
        run: |
          autoninja -C out/Default chrome -j$(nproc)

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          cp -r out/Default/chrome artifacts/
          cp out/Default/*.so artifacts/ 2>/dev/null || true
          cp out/Default/icudtl.dat artifacts/ 2>/dev/null || true
          cp out/Default/resources.pak artifacts/ 2>/dev/null || true
          cp -r out/Default/locales artifacts/ 2>/dev/null || true
          tar -czf os-browser-linux-x64.tar.gz -C artifacts .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: os-browser-linux-x64
          path: os-browser-linux-x64.tar.gz
          retention-days: 14

  build-windows:
    name: Build OS Browser (Windows x64)
    runs-on: windows-2022
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_os == 'win' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up depot_tools
        shell: powershell
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          echo "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & C:\depot_tools\update_depot_tools.bat
          python C:\depot_tools\bootstrap\ensure_bootstrap.py
          & C:\depot_tools\gclient.bat --version

      - name: Configure GN build args (Windows)
        shell: cmd
        run: |
          mkdir out\Default
          (
            echo is_debug = false
            echo is_official_build = false
            echo is_component_build = false
            echo symbol_level = 0
            echo target_os = "win"
            echo target_cpu = "${{ inputs.target_cpu || 'x64' }}"
            echo branding_path_component = "chromium"
            echo chrome_pgo_phase = 0
            echo enable_nacl = false
          ) > out\Default\args.gn

      - name: Generate build files
        shell: cmd
        run: gn gen out\Default

      - name: Compile OS Browser
        shell: cmd
        run: autoninja -C out\Default chrome

      - name: Package artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item out\Default\chrome.exe artifacts\
          Copy-Item out\Default\*.dll artifacts\ -ErrorAction SilentlyContinue
          Copy-Item out\Default\icudtl.dat artifacts\ -ErrorAction SilentlyContinue
          Copy-Item out\Default\resources.pak artifacts\ -ErrorAction SilentlyContinue
          Copy-Item out\Default\locales artifacts\ -Recurse -ErrorAction SilentlyContinue
          Compress-Archive -Path artifacts\* -DestinationPath os-browser-windows-x64.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: os-browser-windows-x64
          path: os-browser-windows-x64.zip
          retention-days: 14

  build-android:
    name: Build OS Browser (Android)
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_os == 'android' }}

    env:
      ANDROID_SDK_ROOT: /opt/android-sdk
      NDK_VERSION: "27.2.12479018"
      BUILD_TOOLS_VERSION: "34.0.0"
      ANDROID_API_LEVEL: "33"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip \
            git curl wget unzip \
            lsb-release \
            pkg-config \
            build-essential \
            libncurses5 \
            lib32z1 lib32stdc++6 \
            libc6-i386 \
            openjdk-17-jdk

      - name: Install Android SDK command-line tools
        run: |
          sudo mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          sudo unzip -q /tmp/cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          sudo mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Accept Android SDK licenses and install NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "platform-tools" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Set up depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /tmp/depot_tools
          echo "/tmp/depot_tools" >> $GITHUB_PATH
          /tmp/depot_tools/update_depot_tools
          python3 /tmp/depot_tools/bootstrap/ensure_bootstrap.py
          python3 /tmp/depot_tools/gclient.py --version

      - name: Install Linux build dependencies
        run: |
          chmod +x build/install-build-deps.sh
          sudo build/install-build-deps.sh --no-prompt --android
          if [ -f build/install-build-deps-android.sh ]; then
            chmod +x build/install-build-deps-android.sh
            sudo build/install-build-deps-android.sh
          fi

      - name: Configure GN build args (Android)
        run: |
          mkdir -p out/Android
          CPU="${{ inputs.target_cpu }}"
          # Default to arm64 when cpu is a desktop value
          if [[ "$CPU" == "x64" || "$CPU" == "x86" ]]; then CPU="arm64"; fi
          cat > out/Android/args.gn << GN_EOF
          is_debug = false
          is_official_build = false
          is_component_build = false
          symbol_level = 0
          target_os = "android"
          target_cpu = "$CPU"
          branding_path_component = "chromium"
          chrome_pgo_phase = 0
          enable_nacl = false
          android_sdk_version = "${ANDROID_API_LEVEL}"
          android_ndk_root = "${ANDROID_NDK_HOME}"
          GN_EOF

      - name: Generate build files
        run: |
          gn gen out/Android

      - name: Compile OS Browser APK
        run: |
          autoninja -C out/Android chrome_public_apk -j$(nproc)

      - name: Locate and rename APK
        run: |
          APK=$(find out/Android -name "ChromePublic.apk" -o -name "chrome_public.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find out/Android/apks -name "*.apk" 2>/dev/null | head -1)
          fi
          echo "Found APK: $APK"
          CPU="${{ inputs.target_cpu }}"
          if [[ "$CPU" == "x64" || "$CPU" == "x86" ]]; then CPU="arm64"; fi
          cp "$APK" "os-browser-android-${CPU}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-browser-android-${{ inputs.target_cpu == 'arm' && 'arm' || 'arm64' }}
          path: os-browser-android-*.apk
          retention-days: 14
