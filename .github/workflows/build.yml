name: Build OS Browser

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target_os:
        description: "Target OS"
        required: false
        default: "linux"
        type: choice
        options:
          - linux
          - win
          - android
      target_cpu:
        description: "Target CPU architecture"
        required: false
        default: "x64"
        type: choice
        options:
          - x64
          - x86
          - arm64
          - arm
      checkout_mode:
        description: "Use current repo if it is Chromium, otherwise fetch Chromium"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - current-repo
          - fetch-chromium

permissions:
  contents: read

concurrency:
  group: build-os-browser-${{ github.ref }}-${{ github.event_name }}-${{ inputs.target_os || 'linux' }}-${{ inputs.target_cpu || 'x64' }}
  cancel-in-progress: true

env:
  PRODUCT_NAME: os_browser
  DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
  DEPOT_TOOLS_UPDATE: "1"
  CHROMIUM_FETCH_DEPTH: "--no-history"

jobs:
  build-linux:
    name: Build OS Browser Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_os == 'linux' }}

    env:
      DEPOT_TOOLS_DIR: /tmp/depot_tools
      WORK_ROOT: ${{ github.workspace }}/chromium-work
      SRC_DIR: ${{ github.workspace }}/chromium-work/src
      OUT_DIR: out/Default

    steps:
      - name: Checkout OS Browser repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: repo

      - name: Install Linux host dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            lsb-release \
            pkg-config \
            build-essential \
            ninja-build \
            xz-utils \
            unzip \
            file \
            rsync \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf2.0-dev \
            libxss-dev \
            libxtst-dev \
            libnss3-dev \
            libcups2-dev \
            libxrandr-dev \
            libasound2-dev \
            libpulse-dev \
            libspeechd-dev \
            libdbus-1-dev

      - name: Set up depot_tools
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$DEPOT_TOOLS_DIR"
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS_DIR"

          echo "$DEPOT_TOOLS_DIR" >> "$GITHUB_PATH"

          export PATH="$DEPOT_TOOLS_DIR:$PATH"

          "$DEPOT_TOOLS_DIR/update_depot_tools" || true

          gclient --version
          gn --version
          autoninja --version

          test -f "$DEPOT_TOOLS_DIR/python3_bin_reldir.txt"

      - name: Prepare Chromium source
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$DEPOT_TOOLS_DIR:$PATH"

          MODE="${{ inputs.checkout_mode || 'auto' }}"

          if [[ "$MODE" == "current-repo" ]]; then
            if [[ ! -f "$GITHUB_WORKSPACE/repo/.gn" ]]; then
              echo "::error::checkout_mode=current-repo was selected, but the repository is not a Chromium checkout. Missing .gn."
              exit 1
            fi

            rm -rf "$WORK_ROOT"
            mkdir -p "$WORK_ROOT"
            ln -s "$GITHUB_WORKSPACE/repo" "$SRC_DIR"
          elif [[ "$MODE" == "fetch-chromium" ]]; then
            rm -rf "$WORK_ROOT"
            mkdir -p "$WORK_ROOT"
            cd "$WORK_ROOT"

            fetch --nohooks --no-history chromium
          else
            if [[ -f "$GITHUB_WORKSPACE/repo/.gn" ]]; then
              rm -rf "$WORK_ROOT"
              mkdir -p "$WORK_ROOT"
              ln -s "$GITHUB_WORKSPACE/repo" "$SRC_DIR"
            else
              rm -rf "$WORK_ROOT"
              mkdir -p "$WORK_ROOT"
              cd "$WORK_ROOT"

              fetch --nohooks --no-history chromium
            fi
          fi

          cd "$SRC_DIR"

          if [[ ! -f ".gn" ]]; then
            echo "::error::Chromium source setup failed. Missing $SRC_DIR/.gn."
            exit 1
          fi

          gclient sync --nohooks --with_branch_heads --with_tags
          gclient runhooks

      - name: Install Chromium Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$DEPOT_TOOLS_DIR:$PATH"

          cd "$SRC_DIR"

          if [[ -x build/install-build-deps.sh ]]; then
            sudo build/install-build-deps.sh --no-prompt || true
          fi

      - name: Configure GN Linux build
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$DEPOT_TOOLS_DIR:$PATH"

          cd "$SRC_DIR"

          mkdir -p "$OUT_DIR"

          cat > "$OUT_DIR/args.gn" <<'GN_EOF'
          is_debug = false
          is_official_build = false
          is_component_build = false
          symbol_level = 0

          target_os = "linux"
          target_cpu = "x64"

          branding_path_component = "chromium"
          chrome_pgo_phase = 0

          enable_nacl = false
          enable_linux_installer = false
          treat_warnings_as_errors = false

          use_sysroot = true
          use_lld = true
          GN_EOF

          cat "$OUT_DIR/args.gn"

      - name: Generate Linux build files
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$DEPOT_TOOLS_DIR:$PATH"

          cd "$SRC_DIR"
          gn gen "$OUT_DIR"

      - name: Compile Linux browser
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$DEPOT_TOOLS_DIR:$PATH"

          cd "$SRC_DIR"
          autoninja -C "$OUT_DIR" chrome -j"$(nproc)"

      - name: Package Linux browser
        shell: bash
        run: |
          set -euo pipefail

          cd "$SRC_DIR"

          rm -rf "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/os-browser-linux-x64"

          cp "$OUT_DIR/chrome" "$GITHUB_WORKSPACE/artifacts/os-browser-linux-x64/"

          cp "$OUT_DIR/chrome_sandbox" "$GITHUB_WORKSPACE/artifacts/os-browser-linux-x64/" 2>/dev/null || true
          cp "$OUT_DIR/icudtl.dat" "$GITHUB_WORKSPACE/artifacts/os-browser-linux-x64/" 2>/dev/null || true

          cp "$OUT_DIR/"*.pak "$GITHUB_WORKSPACE/artifacts/os-browser-linux-x64/" 2>/dev/null || true
          cp "$OUT_DIR/"*.bin "$GITHUB_WORKSPACE/artifacts/os-browser-linux-x64/" 2>/dev/null || true
          cp "$OUT_DIR/"*.so "$GITHUB_WORKSPACE/artifacts/os-browser-linux-x64/" 2>/dev/null || true

          cp -r "$OUT_DIR/locales" "$GITHUB_WORKSPACE/artifacts/os-browser-linux-x64/" 2>/dev/null || true
          cp -r "$OUT_DIR/resources" "$GITHUB_WORKSPACE/artifacts/os-browser-linux-x64/" 2>/dev/null || true
          cp -r "$OUT_DIR/swiftshader" "$GITHUB_WORKSPACE/artifacts/os-browser-linux-x64/" 2>/dev/null || true

          cat > "$GITHUB_WORKSPACE/artifacts/os-browser-linux-x64/run-os-browser.sh" <<'EOF'
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/chrome" "$@"
          EOF

          chmod +x "$GITHUB_WORKSPACE/artifacts/os-browser-linux-x64/run-os-browser.sh"

          cd "$GITHUB_WORKSPACE/artifacts"
          tar -czf "$GITHUB_WORKSPACE/os-browser-linux-x64.tar.gz" os-browser-linux-x64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-browser-linux-x64
          path: os-browser-linux-x64.tar.gz
          retention-days: 14

  build-windows:
    name: Build OS Browser Windows ${{ inputs.target_cpu || 'x64' }}
    runs-on: windows-2022
    timeout-minutes: 360
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_os == 'win' }}

    env:
      DEPOT_TOOLS_DIR: C:\depot_tools
      WORK_ROOT: C:\chromium-work
      SRC_DIR: C:\chromium-work\src
      OUT_DIR: out\Default
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"

    steps:
      - name: Checkout OS Browser repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up depot_tools
        shell: powershell
        run: |
          if (Test-Path "${env:DEPOT_TOOLS_DIR}") {
            Remove-Item -Recurse -Force "${env:DEPOT_TOOLS_DIR}"
          }

          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "${env:DEPOT_TOOLS_DIR}"

          "${env:DEPOT_TOOLS_DIR}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $env:PATH = "${env:DEPOT_TOOLS_DIR};$env:PATH"

          & "${env:DEPOT_TOOLS_DIR}\update_depot_tools.bat"

          gclient --version
          gn --version
          autoninja --version

          if (!(Test-Path "${env:DEPOT_TOOLS_DIR}\python3_bin_reldir.txt")) {
            Write-Error "depot_tools bootstrap failed. Missing python3_bin_reldir.txt."
          }

      - name: Prepare Chromium source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $env:PATH = "${env:DEPOT_TOOLS_DIR};$env:PATH"

          $mode = "${{ inputs.checkout_mode }}"
          if ([string]::IsNullOrWhiteSpace($mode)) {
            $mode = "auto"
          }

          $repoPath = "${env:GITHUB_WORKSPACE}\repo"

          if ($mode -eq "current-repo") {
            if (!(Test-Path "$repoPath\.gn")) {
              Write-Error "checkout_mode=current-repo was selected, but the repository is not a Chromium checkout. Missing .gn."
            }

            if (Test-Path "${env:WORK_ROOT}") {
              Remove-Item -Recurse -Force "${env:WORK_ROOT}"
            }

            New-Item -ItemType Directory -Force -Path "${env:WORK_ROOT}" | Out-Null
            cmd /c mklink /D "${env:SRC_DIR}" "$repoPath"
          }
          elseif ($mode -eq "fetch-chromium") {
            if (Test-Path "${env:WORK_ROOT}") {
              Remove-Item -Recurse -Force "${env:WORK_ROOT}"
            }

            New-Item -ItemType Directory -Force -Path "${env:WORK_ROOT}" | Out-Null
            Set-Location "${env:WORK_ROOT}"

            fetch --nohooks --no-history chromium
          }
          else {
            if (Test-Path "$repoPath\.gn") {
              if (Test-Path "${env:WORK_ROOT}") {
                Remove-Item -Recurse -Force "${env:WORK_ROOT}"
              }

              New-Item -ItemType Directory -Force -Path "${env:WORK_ROOT}" | Out-Null
              cmd /c mklink /D "${env:SRC_DIR}" "$repoPath"
            }
            else {
              if (Test-Path "${env:WORK_ROOT}") {
                Remove-Item -Recurse -Force "${env:WORK_ROOT}"
              }

              New-Item -ItemType Directory -Force -Path "${env:WORK_ROOT}" | Out-Null
              Set-Location "${env:WORK_ROOT}"

              fetch --nohooks --no-history chromium
            }
          }

          Set-Location "${env:SRC_DIR}"

          if (!(Test-Path ".gn")) {
            Write-Error "Chromium source setup failed. Missing ${env:SRC_DIR}\.gn."
          }

          gclient sync --nohooks --with_branch_heads --with_tags
          gclient runhooks

      - name: Resolve Windows CPU
        id: cpu
        shell: powershell
        run: |
          $cpu = "${{ inputs.target_cpu }}"

          if ([string]::IsNullOrWhiteSpace($cpu)) {
            $cpu = "x64"
          }

          if ($cpu -ne "x64" -and $cpu -ne "x86" -and $cpu -ne "arm64") {
            Write-Error "Windows target_cpu must be x64, x86, or arm64. Got: $cpu"
          }

          "cpu=$cpu" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Configure GN Windows build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $env:PATH = "${env:DEPOT_TOOLS_DIR};$env:PATH"

          Set-Location "${env:SRC_DIR}"

          New-Item -ItemType Directory -Force -Path "${env:OUT_DIR}" | Out-Null

          @"
          is_debug = false
          is_official_build = false
          is_component_build = false
          symbol_level = 0

          target_os = "win"
          target_cpu = "${{ steps.cpu.outputs.cpu }}"

          branding_path_component = "chromium"
          chrome_pgo_phase = 0

          enable_nacl = false
          treat_warnings_as_errors = false

          use_lld = true
          "@ | Set-Content -Path "${env:OUT_DIR}\args.gn" -Encoding ascii

          Get-Content "${env:OUT_DIR}\args.gn"

      - name: Generate Windows build files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $env:PATH = "${env:DEPOT_TOOLS_DIR};$env:PATH"

          Set-Location "${env:SRC_DIR}"
          gn gen "${env:OUT_DIR}"

      - name: Compile Windows browser
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $env:PATH = "${env:DEPOT_TOOLS_DIR};$env:PATH"

          Set-Location "${env:SRC_DIR}"
          autoninja -C "${env:OUT_DIR}" chrome

      - name: Package Windows browser
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location "${env:SRC_DIR}"

          $artifactDir = "${env:GITHUB_WORKSPACE}\artifacts\os-browser-windows-${{ steps.cpu.outputs.cpu }}"

          Remove-Item -Recurse -Force "${env:GITHUB_WORKSPACE}\artifacts" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$artifactDir" | Out-Null

          Copy-Item "${env:OUT_DIR}\chrome.exe" "$artifactDir\"
          Copy-Item "${env:OUT_DIR}\*.dll" "$artifactDir\" -ErrorAction SilentlyContinue
          Copy-Item "${env:OUT_DIR}\*.pak" "$artifactDir\" -ErrorAction SilentlyContinue
          Copy-Item "${env:OUT_DIR}\*.bin" "$artifactDir\" -ErrorAction SilentlyContinue
          Copy-Item "${env:OUT_DIR}\icudtl.dat" "$artifactDir\" -ErrorAction SilentlyContinue
          Copy-Item "${env:OUT_DIR}\locales" "$artifactDir\" -Recurse -ErrorAction SilentlyContinue
          Copy-Item "${env:OUT_DIR}\resources" "$artifactDir\" -Recurse -ErrorAction SilentlyContinue
          Copy-Item "${env:OUT_DIR}\swiftshader" "$artifactDir\" -Recurse -ErrorAction SilentlyContinue

          Compress-Archive -Path "$artifactDir\*" -DestinationPath "${env:GITHUB_WORKSPACE}\os-browser-windows-${{ steps.cpu.outputs.cpu }}.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-browser-windows-${{ steps.cpu.outputs.cpu }}
          path: os-browser-windows-${{ steps.cpu.outputs.cpu }}.zip
          retention-days: 14

  build-android:
    name: Build OS Browser Android ${{ inputs.target_cpu || 'arm64' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_os == 'android' }}

    env:
      DEPOT_TOOLS_DIR: /tmp/depot_tools
      WORK_ROOT: ${{ github.workspace }}/chromium-work
      SRC_DIR: ${{ github.workspace }}/chromium-work/src
      OUT_DIR: out/Android
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_HOME: /opt/android-sdk

    steps:
      - name: Checkout OS Browser repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: repo

      - name: Install Android host dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            lsb-release \
            pkg-config \
            build-essential \
            ninja-build \
            xz-utils \
            unzip \
            file \
            rsync \
            openjdk-17-jdk \
            libncurses5 \
            lib32z1 \
            lib32stdc++6 \
            libc6-i386

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up depot_tools
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$DEPOT_TOOLS_DIR"
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS_DIR"

          echo "$DEPOT_TOOLS_DIR" >> "$GITHUB_PATH"

          export PATH="$DEPOT_TOOLS_DIR:$PATH"

          "$DEPOT_TOOLS_DIR/update_depot_tools" || true

          gclient --version
          gn --version
          autoninja --version

          test -f "$DEPOT_TOOLS_DIR/python3_bin_reldir.txt"

      - name: Prepare Chromium Android source
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$DEPOT_TOOLS_DIR:$PATH"

          MODE="${{ inputs.checkout_mode || 'auto' }}"

          if [[ "$MODE" == "current-repo" ]]; then
            if [[ ! -f "$GITHUB_WORKSPACE/repo/.gn" ]]; then
              echo "::error::checkout_mode=current-repo was selected, but the repository is not a Chromium checkout. Missing .gn."
              exit 1
            fi

            rm -rf "$WORK_ROOT"
            mkdir -p "$WORK_ROOT"
            ln -s "$GITHUB_WORKSPACE/repo" "$SRC_DIR"

            cd "$WORK_ROOT"
            if [[ -f ".gclient" ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p = Path(".gclient")
          s = p.read_text()
          if "target_os" not in s:
              s += "\ntarget_os = ['android']\n"
          elif "android" not in s:
              s += "\ntarget_os = ['android']\n"
          p.write_text(s)
          PY
            fi
          elif [[ "$MODE" == "fetch-chromium" ]]; then
            rm -rf "$WORK_ROOT"
            mkdir -p "$WORK_ROOT"
            cd "$WORK_ROOT"

            fetch --nohooks --no-history android
          else
            if [[ -f "$GITHUB_WORKSPACE/repo/.gn" ]]; then
              rm -rf "$WORK_ROOT"
              mkdir -p "$WORK_ROOT"
              ln -s "$GITHUB_WORKSPACE/repo" "$SRC_DIR"

              cd "$WORK_ROOT"
              cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ["android"]
          EOF
            else
              rm -rf "$WORK_ROOT"
              mkdir -p "$WORK_ROOT"
              cd "$WORK_ROOT"

              fetch --nohooks --no-history android
            fi
          fi

          cd "$SRC_DIR"

          if [[ ! -f ".gn" ]]; then
            echo "::error::Chromium Android source setup failed. Missing $SRC_DIR/.gn."
            exit 1
          fi

          gclient sync --nohooks --with_branch_heads --with_tags
          gclient runhooks

      - name: Install Chromium Android build dependencies
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$DEPOT_TOOLS_DIR:$PATH"

          cd "$SRC_DIR"

          if [[ -x build/install-build-deps.sh ]]; then
            sudo build/install-build-deps.sh --no-prompt --android || true
          fi

          if [[ -x build/install-build-deps-android.sh ]]; then
            sudo build/install-build-deps-android.sh || true
          fi

      - name: Resolve Android CPU
        id: cpu
        shell: bash
        run: |
          set -euo pipefail

          CPU="${{ inputs.target_cpu }}"

          if [[ -z "$CPU" ]]; then
            CPU="arm64"
          fi

          case "$CPU" in
            arm64)
              GN_CPU="arm64"
              ;;
            arm)
              GN_CPU="arm"
              ;;
            x64)
              GN_CPU="x64"
              ;;
            x86)
              GN_CPU="x86"
              ;;
            *)
              echo "::error::Invalid Android target_cpu: $CPU"
              exit 1
              ;;
          esac

          echo "cpu=$GN_CPU" >> "$GITHUB_OUTPUT"

      - name: Configure GN Android build
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$DEPOT_TOOLS_DIR:$PATH"

          cd "$SRC_DIR"

          mkdir -p "$OUT_DIR"

          cat > "$OUT_DIR/args.gn" <<GN_EOF
          is_debug = false
          is_official_build = false
          is_component_build = false
          symbol_level = 0

          target_os = "android"
          target_cpu = "${{ steps.cpu.outputs.cpu }}"

          branding_path_component = "chromium"
          chrome_pgo_phase = 0

          enable_nacl = false
          treat_warnings_as_errors = false

          use_lld = true
          GN_EOF

          cat "$OUT_DIR/args.gn"

      - name: Generate Android build files
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$DEPOT_TOOLS_DIR:$PATH"

          cd "$SRC_DIR"
          gn gen "$OUT_DIR"

      - name: Compile Android APK
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$DEPOT_TOOLS_DIR:$PATH"

          cd "$SRC_DIR"
          autoninja -C "$OUT_DIR" chrome_public_apk -j"$(nproc)"

      - name: Package Android APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$SRC_DIR"

          APK="$(find "$OUT_DIR" -type f \( -name "ChromePublic.apk" -o -name "chrome_public.apk" -o -name "*.apk" \) | head -n 1)"

          if [[ -z "$APK" ]]; then
            echo "::error::No APK was produced."
            find "$OUT_DIR" -maxdepth 5 -type f | sort | tail -200
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/os-browser-android-${{ steps.cpu.outputs.cpu }}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-browser-android-${{ steps.cpu.outputs.cpu }}
          path: os-browser-android-${{ steps.cpu.outputs.cpu }}.apk
          retention-days: 14
