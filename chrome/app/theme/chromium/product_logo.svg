<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="256"
   height="256"
   viewBox="0 0 256 256"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- OS Browser diamond logo: 4 colored quadrants -->
  <defs>
    <clipPath id="diamond-clip">
      <polygon points="128,4 252,128 128,252 4,128"/>
    </clipPath>
  </defs>
  <!-- Yellow: top-left quadrant -->
  <polygon points="128,4 128,128 4,128" fill="#FFDC00" clip-path="url(#diamond-clip)"/>
  <!-- Red: top-right quadrant -->
  <polygon points="128,4 252,128 128,128" fill="#DC0000" clip-path="url(#diamond-clip)"/>
  <!-- Green: bottom-left quadrant -->
  <polygon points="4,128 128,128 128,252" fill="#00C800" clip-path="url(#diamond-clip)"/>
  <!-- Blue: bottom-right quadrant -->
  <polygon points="128,128 252,128 128,252" fill="#0050DC" clip-path="url(#diamond-clip)"/>
  <!-- Cross lines -->
  <line x1="128" y1="4" x2="128" y2="252" stroke="#000000" stroke-width="4"/>
  <line x1="4" y1="128" x2="252" y2="128" stroke="#000000" stroke-width="4"/>
  <!-- Diamond outline -->
  <polygon points="128,4 252,128 128,252 4,128" fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
</svg>
